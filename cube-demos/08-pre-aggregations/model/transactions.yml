cubes:
  - name: transactions
    title: 交易预聚合
    sql_table: public.transactions

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: side
        title: 交易方向
        sql: side
        type: string

      - name: traded_at
        title: 交易时间
        sql: traded_at
        type: time

    measures:
      - name: count
        title: 交易笔数
        type: count

      - name: total_quantity
        title: 成交数量
        sql: quantity
        type: sum

      - name: total_amount
        title: 成交金额
        sql: "quantity * price"
        type: sum

    pre_aggregations:
      - name: daily_transactions
        type: rollup
        measures:
          - count
          - total_quantity
          - total_amount
        dimensions:
          - side
        time_dimension: traded_at
        granularity: day
        refresh_key:
          every: 1 hour
